<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сөз таптары тренажері</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Serif:wght@600;800&display=swap">
<style>
/* Layout: тар баған, жоғарыда көк тақырып жолағы + сары өрнек, астында төрт бөлім (теория, жаттығу, емтихан, прогресс) */
:root{
  --bg:#f3f8fa; --surface:#ffffff; --ink:#10283a; --muted:#4d6676; --line:#d3e0e7;
  --hero:#0f4c66; --hero-ink:#ffffff; --sun:#f0b400; --sky:#14789a; --on-sky:#ffffff; --sky-soft:#e1f1f6;
  --good:#1b7f47; --good-bg:#e1f4e8; --bad:#b83232; --bad-bg:#fbe7e7;
  --cs:55%; --cb-l:92%; --cf-l:26%; --cd-l:42%;
  --font-display:'Noto Serif',Georgia,'Times New Roman',serif;
  --font-body:'Noto Sans','Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1720; --surface:#112431; --ink:#e5f0f6; --muted:#9bb4c3; --line:#23404f;
    --hero:#0b3447; --hero-ink:#f2f9fc; --sun:#f5c542; --sky:#4cc3e6; --on-sky:#062330; --sky-soft:#13323f;
    --good:#58cb86; --good-bg:#12331f; --bad:#ff8383; --bad-bg:#3a1a1c;
    --cb-l:22%; --cf-l:82%; --cd-l:62%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1720; --surface:#112431; --ink:#e5f0f6; --muted:#9bb4c3; --line:#23404f;
  --hero:#0b3447; --hero-ink:#f2f9fc; --sun:#f5c542; --sky:#4cc3e6; --on-sky:#062330; --sky-soft:#13323f;
  --good:#58cb86; --good-bg:#12331f; --bad:#ff8383; --bad-bg:#3a1a1c;
  --cb-l:22%; --cf-l:82%; --cd-l:62%; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;margin:0}
h1,h2,h3{font-family:var(--font-display);line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{background:var(--hero);color:var(--hero-ink)}
.top .wrap{padding-block:28px 22px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
.brand{min-width:0;flex:1 1 320px}
.brand .eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.brand h1{font-size:clamp(34px,7vw,56px);font-weight:800;margin-top:6px}
.brand p{margin-top:10px;max-width:46ch;opacity:.92}
.hstat{display:flex;gap:10px;flex-wrap:wrap}
.hstat div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:10px 14px;min-width:96px}
.hstat b{display:block;font-family:var(--font-display);font-size:26px;font-variant-numeric:tabular-nums}
.hstat span{font-size:12px;opacity:.85}
.orn{height:12px;background:
  linear-gradient(135deg,var(--sun) 25%,transparent 25%) -6px 0/12px 12px,
  linear-gradient(225deg,var(--sun) 25%,transparent 25%) -6px 0/12px 12px,
  linear-gradient(315deg,var(--sun) 25%,transparent 25%) 0 0/12px 12px,
  linear-gradient(45deg,var(--sun) 25%,transparent 25%) 0 0/12px 12px;background-color:var(--hero)}

/* Tabs */
.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;padding:14px 16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sun)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}

main{padding-block:28px 56px}
.view[hidden]{display:none}
.sec-title{font-size:26px;margin-bottom:6px}
.lead{color:var(--muted);max-width:62ch}

/* Generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.btn{background:var(--sky);color:var(--on-sky);border:0;border-radius:8px;padding:11px 20px;font-weight:700}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;background:hsl(var(--h,200) var(--cs) var(--cb-l));color:hsl(var(--h,200) 60% var(--cf-l))}
.chip{display:inline-block;padding:3px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:14px;margin:2px 4px 2px 0}
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
th{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
tr:last-child td{border-bottom:0}

/* Theory */
.intro-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:20px}
.intro-grid>*{min-width:0}
.steps{margin:10px 0 0;padding-left:20px;display:grid;gap:6px}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}
.toc a{text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:500;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.toc a i{width:10px;height:10px;border-radius:50%;background:hsl(var(--h) 65% var(--cd-l))}
.group-h{margin:30px 0 12px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cls{scroll-margin-top:70px;margin-bottom:16px}
.cls-head{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.cls-head h3{font-size:24px;display:flex;align-items:center;gap:12px}
.cls-head h3 i{width:14px;height:14px;border-radius:50%;background:hsl(var(--h) 65% var(--cd-l));flex:none}
.q-line{margin-top:10px;color:var(--muted)}
.def{margin-top:10px;max-width:68ch}
.kinds{margin-top:14px;display:grid;gap:10px}
.kind{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:4px 14px;padding-top:10px;border-top:1px dashed var(--line)}
.kind>*{min-width:0}
.kind b{font-size:15px}
.kind small{display:block;color:var(--muted);font-size:13px}
.note{margin-top:14px;background:var(--sky-soft);border-radius:8px;padding:12px 14px;font-size:15px}
.cls-foot{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:560px){.kind{grid-template-columns:1fr}}

/* Quiz */
.setup{display:grid;gap:18px;margin-top:20px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px}
.pick button[aria-pressed="true"]{background:var(--sky);color:var(--on-sky);border-color:var(--sky);font-weight:700}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:12px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1 1 140px;min-width:80px}
.bar>i{display:block;height:100%;background:var(--sky)}
.qcard{margin-top:16px}
.qprompt{font-family:var(--font-display);font-size:22px;font-weight:600;text-wrap:balance}
.sentence{margin-top:14px;padding:14px 16px;background:var(--bg);border-radius:8px;font-size:19px;border:1px solid var(--line)}
.sentence mark{background:color-mix(in srgb,var(--sun) 55%,transparent);color:inherit;padding:1px 6px;border-radius:4px;font-weight:700}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--sky)}
.opt.sel{border-color:var(--sky);background:var(--sky-soft)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;padding:12px 14px;border-radius:8px;font-size:15px}
.fb.ok{background:var(--good-bg);color:var(--ink);border-left:4px solid var(--good)}
.fb.no{background:var(--bad-bg);color:var(--ink);border-left:4px solid var(--bad)}
.qfoot{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.dots button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums}
.dots button.done{background:var(--sky-soft);border-color:var(--sky)}
.dots button.cur{outline:2px solid var(--sun);outline-offset:1px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.timer.low{color:var(--bad)}

/* Results */
.score{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center}
.score .big{font-family:var(--font-display);font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:24px;color:var(--muted);font-weight:600}
.review{display:grid;gap:12px;margin-top:20px}
.rv{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px;border-left:4px solid var(--line)}
.rv.ok{border-left-color:var(--good)}
.rv.no{border-left-color:var(--bad)}
.rv p{font-size:15px}
.rv .rq{font-weight:700}
.rv .sentence{font-size:16px;padding:8px 12px;margin:8px 0}

/* Progress */
.prow{display:grid;grid-template-columns:150px 1fr 80px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .bar{height:10px;border-radius:5px;flex:none;width:100%}
.prow .bar>i{background:hsl(var(--h) 65% var(--cd-l))}
.prow span.v{font-variant-numeric:tabular-nums;text-align:right;font-size:14px;color:var(--muted)}
@media (max-width:520px){.prow{grid-template-columns:1fr 70px}.prow .bar{grid-column:1/-1;order:3}}
.hist{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.hist span{border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-variant-numeric:tabular-nums;background:var(--surface)}
.stack{display:grid;gap:16px;margin-top:20px}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="eyebrow">Қазақ тілі · морфология</div>
      <h1>Сөз таптары</h1>
      <p>Он сөз табының теориясы, 90-нан астам жаттығу сұрағы және 100 ұпайлық емтихан. Оқы, жаттық, тексер.</p>
    </div>
    <div class="hstat" id="hstat"></div>
  </div>
</header>
<div class="orn" aria-hidden="true"></div>

<nav class="tabs" aria-label="Бөлімдер">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" data-v="theory">Теория</button>
    <button class="tab" role="tab" data-v="practice">Жаттығу</button>
    <button class="tab" role="tab" data-v="exam">Емтихан 100/100</button>
    <button class="tab" role="tab" data-v="progress">Прогресс</button>
  </div>
</nav>

<main class="wrap">
  <section class="view" id="v-theory"></section>
  <section class="view" id="v-practice" hidden></section>
  <section class="view" id="v-exam" hidden></section>
  <section class="view" id="v-progress" hidden></section>
</main>

<script>
/* ============ ДЕРЕКТЕР ============ */
const CLASSES=[
 {id:'zat',h:200,name:'Зат есім',group:'Дербес сөздер',q:'кім? не?',hint:'«кім? не?» сұрағына жауап береді',
  def:'Адамның, жан-жануардың, заттың, құбылыстың атын білдіретін сөз табы. Сөйлемде көбіне бастауыш, толықтауыш болады.',
  kinds:[
   ['Жалпы зат есім','бір текті заттардың ортақ аты',['қала','бала','мектеп','өзен','кітап']],
   ['Жалқы зат есім','жеке адамның, жердің, мекеменің аты; бас әріппен жазылады',['Абай','Алматы','Ертіс','Қазақстан','Наурыз']],
   ['Жекеше және көпше','көптік жалғауы -лар/-лер, -дар/-дер, -тар/-тер',['бала — балалар','кітап — кітаптар','қала — қалалар']],
   ['Жасалуы','негізгі (тау), туынды (оқушы, жазушы), күрделі (қарлығаш, ақсақал)',['оқу+шы = оқушы','көз+дік = көзілдірік?']]],
  note:'Зат есім жеті септікте түрленеді (төмендегі кестені қараңыз). Септік жалғауын тану сөз табын анықтауға көмектеседі.',
  septik:true},
 {id:'sin',h:150,name:'Сын есім',group:'Дербес сөздер',q:'қандай? қай?',hint:'«қандай? қай?» сұрағына жауап береді',
  def:'Заттың түсін, сапасын, көлемін, дәмін, қатыстылығын білдіреді. Көбіне зат есімнің алдында тұрып, оның анықтауышы болады.',
  kinds:[

   ['Қатыстық сын есім','заттың қай затқа қатысты екенін көрсетеді; шырайға келмейді',['алтын сағат','күміс қасық','темір есік','ағаш үй','жүн жемпір']],
   ['Жай шырай','заттың белгісі өзгеріссіз беріледі',['ақ','биік','тәтті']],
   ['Салыстырмалы шырай','белгі әлсіз немесе аздау: -ғылт, -шыл, -ғыштау',['ақшыл','көгілдір','қызғылт','сарғылт']],
   ['Күшейтпелі шырай','белгі күшті: қайталау, аса, ең, тым',['қып-қызыл','appaқ','аса биік','ең әдемі']]],
  note:'Сұрақ «қандай?» болса да, сөздің сөйлемдегі қызметіне қараңыз: «жақсы оқушы» — сын есім, «жақсы оқиды» — үстеу.'},
 {id:'san',h:35,name:'Сан есім',group:'Дербес сөздер',q:'қанша? неше? нешінші?',hint:'«қанша? неше? нешінші?» сұрағына жауап береді',
  def:'Заттың санын, реттік нөмірін, өлшемін білдіреді.',
  kinds:[
   ['Есептік сан','заттың санын атайды: қанша? неше?',['бір','бес','жиырма','жүз','мың']],
   ['Реттік сан','заттың санамадағы орнын көрсетеді: нешінші? -ыншы/-інші, -ншы/-нші',['бірінші','үшінші','жиырмасыншы']],

   ['Болжалдық сан','нақты емес, шамалап айтылған сан',['бір-екі','он шақты','жиырмалар','бес-алты']],
   ['Бөлшек сан','бүтін заттың бөлігін білдіреді',['үштен бір','жарты','бестен екі','ширек']]],
  note:'Санның жасалуы: жай (он), күрделі (он бес, жиырма жеті), қосарлы (бір-екі).'},
 {id:'esim',h:280,name:'Есімдік',group:'Дербес сөздер',q:'кім? не? қандай? қанша?',hint:'зат, сын, сан есімнің орнына жүреді',
  def:'Зат есімнің, сын есімнің, сан есімнің орнына жүріп, оларды атамай, нұсқап немесе сұрап көрсетеді.',
  kinds:[

   ['Сілтеу есімдігі','затты, белгіні нұсқайды',['бұл','осы','сол','мына','анау','ана']],
   ['Сұрау есімдігі','сұрақ білдіреді',['кім?','не?','қандай?','қанша?','қайда?','қашан?']],
   ['Белгісіздік есімдігі','белгісіз зат, адам, белгіні білдіреді',['біреу','бірдеме','кейбір','қайсыбір','әлдекім']],
   ['Болымсыздық есімдігі','болымсыз мағына береді',['ешкім','ештеңе','ешқандай','түк','ешбір']],
   ['Жалпылау есімдігі','заттың бәрін немесе әрқайсысын қамтиды',['барлық','бәрі','әркім','әрбір','күллі','бүкіл']],
   ['Өздік есімдік','затты өзіне қатысты көрсетеді',['өз','өзім','өзің','өзі']]],
  note:'Есімдік тек сөйлемде орнына жүретін сөзге қарай анықталады. «Мен барамын» — жіктеу есімдігі, ал «Анам мен әкем» — жалғаулық шылау.'},
 {id:'est',h:350,name:'Етістік',group:'Дербес сөздер',q:'не істеді? не қылды? қайтті?',hint:'«не істеді? не қылды?» сұрағына жауап береді',
  def:'Заттың қимылын, іс-әрекетін, күйін білдіреді. Сөйлемде көбіне баяндауыш болады.',
  kinds:[
   ['Болымды етістік','іс-әрекеттің орындалғанын білдіреді',['барды','оқыды','жазды','келеді']],

/* ============ КӨМЕКШІ ============ */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KEY='soz-taptary-v1';
let store={stats:{},exams:[]};
try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);store.stats=o.stats||{};store.exams=o.exams||[]}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function rec(c,ok){const s=store.stats[c]||(store.stats[c]={c:0,t:0});s.t++;if(ok)s.c++;save();hstat()}
const LET=['A','B','C','D'];

function build(src){
  if(src.s){
    const m=src.s.match(/\[\[(.+?)\]\]/),word=m[1],cl=BY[src.c];
    const opts=shuffle([cl,...shuffle(CLASSES.filter(x=>x.id!==src.c)).slice(0,3)]).map(x=>({t:x.name,ok:x.id===src.c}));
    return{cls:src.c,prompt:'Белгіленген сөз қай сөз табына жатады?',
      sentence:esc(src.s).replace(/\[\[(.+?)\]\]/,'<mark>$1</mark>'),
      opts,why:'«'+word+'» — '+cl.name.toLowerCase()+': '+cl.hint+'.'};
  }
  const [c,q,a,w,why]=src;
  return{cls:c,prompt:q,sentence:null,opts:shuffle([a,...w]).map(t=>({t,ok:t===a})),why};
}
const ALL_SRC=[...CTX,...TH];
const srcCls=s=>s.s?s.c:s[0];

/* ============ ЖОҒАРҒЫ СТАТ ============ */
function hstat(){
  let c=0,t=0;Object.values(store.stats).forEach(s=>{c+=s.c;t+=s.t});
  const best=store.exams.reduce((m,e)=>Math.max(m,e.score),0);
  $('#hstat').innerHTML=
   '<div><b>'+ALL_SRC.length+'</b><span>сұрақ базада</span></div>'+
   '<div><b>'+(t?Math.round(c/t*100)+'%':'—')+'</b><span>дұрыс жауап</span></div>'+
   '<div><b>'+(store.exams.length?best:'—')+'</b><span>үздік емтихан</span></div>';
}

/* ============ ЖАТТЫҒУ ============ */
let P=null,pickCls='all';
function qBlock(q,i,n){
  return '<div class="qcard card"><div class="qhead"><span>Сұрақ '+(i+1)+' / '+n+'</span><div class="bar"><i style="width:'+((i)/n*100)+'%"></i></div><span class="tag" style="--h:'+BY[q.cls].h+'">'+BY[q.cls].name+'</span></div><div class="qprompt">'+q.prompt+'</div>'+(q.sentence?'<div class="sentence">'+q.sentence+'</div>':'')+'<div class="opts" id="opts">'+q.opts.map((o,k)=>'<button class="opt" data-k="'+k+'"><span class="k">'+LET[k]+'</span><span>'+esc(o.t)+'</span></button>').join('')+'</div><div id="fb"></div></div>';
}
function practiceSetup(){
  P=null;
  const v=$('#v-practice');
  v.innerHTML='<h2 class="sec-title">Жаттығу</h2><p class="lead">Әр жауаптан кейін дұрыс жауап пен түсіндірме көрсетіледі. Сұрақтар кездейсоқ таңдалады және әр бастағанда өзгереді.</p><div class="setup card"><div><b>Тақырыпты таңдаңыз</b><div class="pick" id="pick" style="margin-top:10px"></div></div><div><button class="btn" id="startP">10 сұрақпен бастау</button></div></div>';
  const pk=$('#pick');
  const opts=[{id:'all',name:'Барлығы (аралас)'}].concat(CLASSES);
  pk.innerHTML=opts.map(o=>'<button data-p="'+o.id+'" aria-pressed="'+(o.id===pickCls)+'">'+o.name+'</button>').join('');
  pk.onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;pickCls=b.dataset.p;$$('#pick button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.p===pickCls))};
  $('#startP').onclick=startPractice;
}
function startPractice(){
  let pool=ALL_SRC.filter(s=>pickCls==='all'||srcCls(s)===pickCls);
  const list=shuffle(pool).slice(0,10).map(build);
  P={list,i:0,score:0,done:false,wrong:{}};
  practiceQ();
}
function practiceQ(){
  const q=P.list[P.i],v=$('#v-practice');
  v.innerHTML='<h2 class="sec-title">Жаттығу</h2>'+qBlock(q,P.i,P.list.length);
  $('#opts').onclick=e=>{
    const b=e.target.closest('.opt');if(!b||P.done)return;
    P.done=true;const k=+b.dataset.k,ok=q.opts[k].ok;
    if(ok)P.score++;else P.wrong[q.cls]=(P.wrong[q.cls]||0)+1;
    rec(q.cls,ok);
    $$('#opts .opt').forEach((x,j)=>{x.disabled=true;if(q.opts[j].ok)x.classList.add('ok');else if(j===k)x.classList.add('no')});
    $('#fb').innerHTML='<div class="fb '+(ok?'ok':'no')+'"><b>'+(ok?'Дұрыс!':'Қате.')+'</b> '+esc(q.why)+'</div><div class="qfoot"><span></span><button class="btn" id="nextP">'+(P.i+1<P.list.length?'Келесі':'Нәтижені көру')+'</button></div>';
    $('#nextP').onclick=()=>{P.done=false;P.i++;P.i<P.list.length?practiceQ():practiceEnd()};
    $('#nextP').focus();
  };
}
function practiceEnd(){
  const n=P.list.length,weak=Object.keys(P.wrong);
  $('#v-practice').innerHTML='<h2 class="sec-title">Жаттығу аяқталды</h2><div class="card" style="margin-top:16px"><div class="score"><div class="big">'+P.score+'<small> / '+n+'</small></div><p>'+(P.score===n?'Тамаша, барлығы дұрыс!':P.score>=n*0.7?'Жақсы нәтиже. Қателерді қайталаңыз.':'Теорияны қайта оқып, тағы бір рет көріңіз.')+'</p></div>'+
   (weak.length?'<p style="margin-top:16px"><b>Қайталауға:</b> '+weak.map(c=>'<span class="tag" style="--h:'+BY[c].h+';margin-right:6px">'+BY[c].name+'</span>').join('')+'</p>':'')+
   '<div class="qfoot" style="justify-content:flex-start"><button class="btn" id="againP">Тағы жаттығу</button><button class="btn alt" id="toTh">Теорияға өту</button></div></div>';
  $('#againP').onclick=startPractice;$('#toTh').onclick=()=>go('theory');
}

/* ============ ЕМТИХАН ============ */
let E=null;
function examIntro(){
  const best=store.exams.reduce((m,e)=>Math.max(m,e.score),0);
  $('#v-exam').innerHTML='<h2 class="sec-title">Емтихан</h2><p class="lead">20 сұрақ, әр сұрақ 5 ұпай, барлығы 100 ұпай. Әр сөз табынан екі сұрақ түседі. Уақыты 20 минут. Жауапты аяқтамай тұрып өзгертуге болады.</p><div class="card" style="margin-top:20px"><div class="score"><div class="big">'+(store.exams.length?best:'—')+'<small> / 100</small></div><p>'+(store.exams.length?'Үздік нәтиже. Барлығы '+store.exams.length+' әрекет.':'Алғашқы емтиханды тапсырыңыз.')+'</p></div><div class="qfoot" style="justify-content:flex-start"><button class="btn" id="startE">Емтиханды бастау</button></div></div>';
  $('#startE').onclick=startExam;
}
function startExam(){
  let picked=[];
  CLASSES.forEach(c=>{picked.push(...shuffle(ALL_SRC.filter(s=>srcCls(s)===c.id)).slice(0,2))});
  E={list:shuffle(picked).map(build),ans:Array(20).fill(null),i:0,left:1200,over:false,warn:false};
  E.timer=setInterval(()=>{E.left--;const t=$('#tm');if(t){t.textContent=fmt(E.left);t.classList.toggle('low',E.left<=120)}if(E.left<=0)finishExam()},1000);
  examQ();
}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function examQ(){
  const q=E.list[E.i],n=E.list.length,v=$('#v-exam');
  const answered=E.ans.filter(a=>a!==null).length;
  v.innerHTML='<div class="qhead"><span>Жауап берілді: '+answered+' / '+n+'</span><span class="timer" id="tm">'+fmt(E.left)+'</span></div><div class="dots" id="dots">'+E.list.map((_,k)=>'<button data-d="'+k+'" class="'+(E.ans[k]!==null?'done ':'')+(k===E.i?'cur':'')+'" aria-label="Сұрақ '+(k+1)+'">'+(k+1)+'</button>').join('')+'</div>'+
   '<div class="qcard card" style="margin-top:0"><div class="qhead"><span>Сұрақ '+(E.i+1)+' / '+n+'</span><span>5 ұпай</span></div><div class="qprompt">'+q.prompt+'</div>'+(q.sentence?'<div class="sentence">'+q.sentence+'</div>':'')+
   '<div class="opts" id="opts">'+q.opts.map((o,k)=>'<button class="opt'+(E.ans[E.i]===k?' sel':'')+'" data-k="'+k+'"><span class="k">'+LET[k]+'</span><span>'+esc(o.t)+'</span></button>').join('')+'</div>'+
   '<div class="qfoot"><div><button class="btn alt" id="prevE"'+(E.i===0?' disabled':'')+'>Артқа</button> <button class="btn alt" id="nextE"'+(E.i===n-1?' disabled':'')+'>Алға</button></div><button class="btn" id="finE">'+(E.warn?'Иә, аяқтау':'Емтиханды аяқтау')+'</button></div>'+
   (E.warn?'<div class="fb no" style="margin-top:12px">Жауап берілмеген сұрақтар бар: '+(n-answered)+'. Аяқтағыңыз келсе, тағы бір рет басыңыз.</div>':'')+'</div>';
  $('#opts').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;E.ans[E.i]=+b.dataset.k;E.warn=false;examQ()};
  $('#dots').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;E.i=+b.dataset.d;E.warn=false;examQ()};
  $('#prevE').onclick=()=>{E.i--;E.warn=false;examQ()};
  $('#nextE').onclick=()=>{E.i++;E.warn=false;examQ()};
  $('#finE').onclick=()=>{if(!E.warn&&E.ans.some(a=>a===null)){E.warn=true;examQ();return}finishExam()};
}
function finishExam(){
  if(!E||E.over)return;E.over=true;clearInterval(E.timer);
  let ok=0;E.list.forEach((q,k)=>{const a=E.ans[k],r=a!==null&&q.opts[a].ok;if(r)ok++;rec(q.cls,r)});
  const score=ok*5;store.exams.push({score,date:new Date().toISOString().slice(0,10)});store.exams=store.exams.slice(-20);save();hstat();
  const msg=score===100?'Тамаша! Толық ұпай: 100/100.':score>=90?'Өте жақсы нәтиже.':score>=75?'Жақсы. Қателермен жұмыс істеңіз.':score>=50?'Қанағаттанарлық. Теорияны қайталаңыз.':'Теорияны қайта оқып шығыңыз.';
  let h='<h2 class="sec-title">Емтихан нәтижесі</h2><div class="card" style="margin-top:16px"><div class="score"><div class="big">'+score+'<small> / 100</small></div><div><p><b>'+msg+'</b></p><p style="color:var(--muted)">Дұрыс жауап: '+ok+' / '+E.list.length+'. Қалған уақыт: '+fmt(Math.max(E.left,0))+'.</p></div></div><div class="qfoot" style="justify-content:flex-start"><button class="btn" id="againE">Қайта тапсыру</button><button class="btn alt" id="toTh2">Теорияға өту</button></div></div><h3 style="margin-top:28px">Жауаптарды талдау</h3><div class="review">';
  E.list.forEach((q,k)=>{
    const a=E.ans[k],r=a!==null&&q.opts[a].ok,right=q.opts.find(o=>o.ok).t;
    h+='<div class="rv '+(r?'ok':'no')+'"><p class="rq">'+(k+1)+'. '+q.prompt+'</p>'+(q.sentence?'<div class="sentence">'+q.sentence+'</div>':'')+'<p>Сіздің жауабыңыз: '+(a===null?'<i>жауап берілмеген</i>':esc(q.opts[a].t))+'</p>'+(r?'':'<p>Дұрыс жауап: <b>'+esc(right)+'</b></p>')+'<p style="color:var(--muted)">'+esc(q.why)+'</p></div>';
  });
  h+='</div>';
  $('#v-exam').innerHTML=h;
  $('#againE').onclick=startExam;$('#toTh2').onclick=()=>go('theory');
  window.scrollTo(0,0);
}

/* ============ ПРОГРЕСС ============ */
let resetArm=false;
function renderProgress(){
  let c=0,t=0;Object.values(store.stats).forEach(s=>{c+=s.c;t+=s.t});
  let h='<h2 class="sec-title">Прогресс</h2><p class="lead">Нәтижелер осы браузерде сақталады. Қай сөз табы әлсіз екенін көріп, сол тақырыпты қайталаңыз.</p><div class="stack"><div class="card"><h3 style="margin-bottom:8px">Сөз таптары бойынша дұрыс жауап</h3>';
  CLASSES.forEach(cl=>{
    const s=store.stats[cl.id]||{c:0,t:0},p=s.t?Math.round(s.c/s.t*100):0;
    h+='<div class="prow" style="--h:'+cl.h+'"><span>'+cl.name+'</span><div class="bar"><i style="width:'+p+'%"></i></div><span class="v">'+(s.t?p+'% ('+s.c+'/'+s.t+')':'әлі жоқ')+'</span></div>';
  });
  h+='</div><div class="card"><h3>Емтихан нәтижелері</h3>'+(store.exams.length?'<div class="hist">'+store.exams.slice().reverse().slice(0,10).map(e=>'<span><b>'+e.score+'</b>/100 · '+e.date+'</span>').join('')+'</div>':'<p class="lead" style="margin-top:8px">Әлі емтихан тапсырылмаған.</p>')+'</div><div class="card"><p>Барлығы жауап берілген сұрақ: <b>'+t+'</b>, дұрыс: <b>'+c+'</b>.</p><div class="qfoot" style="justify-content:flex-start"><button class="btn alt" id="resetP">'+(resetArm?'Иә, барлығын өшіру':'Прогресті өшіру')+'</button></div></div></div>';
  $('#v-progress').innerHTML=h;
  $('#resetP').onclick=()=>{if(!resetArm){resetArm=true;renderProgress();return}resetArm=false;store={stats:{},exams:[]};save();hstat();renderProgress()};
}

/* ============ НАВИГАЦИЯ ============ */
const VIEWS=['theory','practice','exam','progress'];
function go(v){location.hash=v;show(v)}
function show(v){
  if(!VIEWS.includes(v))v='theory';
  VIEWS.forEach(x=>{$('#v-'+x).hidden=x!==v});
  $$('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.v===v)));
  if(v==='practice'&&!P)practiceSetup();
  if(v==='exam'&&!E)examIntro();
  if(v==='progress'){resetArm=false;renderProgress()}
  if(v!=='theory')window.scrollTo(0,0);
}
$$('.tab').forEach(t=>t.onclick=()=>go(t.dataset.v));
document.addEventListener('click',e=>{
  const j=e.target.closest('[data-jump]');
  if(j){e.preventDefault();const el=document.getElementById('cls-'+j.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth'});return}
  const tr=e.target.closest('[data-train]');
  if(tr){pickCls=tr.dataset.train;P=null;go('practice');practiceSetup();startPractice()}
});
document.addEventListener('keydown',e=>{
  const k=['1','2','3','4'].indexOf(e.key);if(k<0)return;
  const b=$$('#opts .opt')[k];if(b&&!b.disabled&&!e.target.closest('input,textarea'))b.click();
});
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
renderTheory();hstat();show(location.hash.slice(1)||'theory');
</script>
